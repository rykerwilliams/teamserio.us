name: Deploy Preview to GitHub Pages

# Temporary: publishes the migration branch to preview.teamserio.us so the real
# GitHub Pages host can be validated at a real domain, with baseurl empty,
# before the apex domain is moved. Production stays on AWS throughout.
#
# Requires, one time:
#   1. Repo Settings > Pages > Source: GitHub Actions
#   2. Namecheap: CNAME  preview  ->  rykerwilliams.github.io
#   3. Settings > Environments > github-pages: allow this branch to deploy
#
# DELETE this workflow, _config_staging.yml and the DNS record at cutover.

on:
  push:
    branches: [gh-pages-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.4'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build site for preview.teamserio.us
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --config _config.yml,_config_staging.yml

      # Written into the artifact rather than committed, so the production
      # branch never carries a preview domain.
      - name: Set custom domain
        run: echo "preview.teamserio.us" > _site/CNAME

      - name: Check the build is self-contained
        run: |
          # Nothing should be pulled from production; see plan section 5.8.
          leaked=$(grep -rho "https://teamserio\.us" _site --include="*.html" | wc -l)
          echo "references to the production domain: $leaked"
          if [ "$leaked" -gt 5 ]; then
            echo "::error::Preview build references production ($leaked). Is _config_staging.yml applied?"
            exit 1
          fi
          grep -q "preview.teamserio.us" _site/index.html \
            && echo "preview hostname present in markup" \
            || { echo "::error::preview hostname missing"; exit 1; }

      - name: Check site size against the Pages limit
        run: |
          mb=$(( $(du -sb _site | cut -f1) / 1024 / 1024 ))
          echo "Published site: ${mb} MB"
          [ "$mb" -gt 900 ] && { echo "::error::Site is ${mb} MB, over the 1 GB Pages limit."; exit 1; } || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
