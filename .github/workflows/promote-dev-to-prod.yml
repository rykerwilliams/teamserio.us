name: Promote Dev to Production

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # _config.yml used to be reverted here, because dev carried
      # url: https://dev.teamserio.us for the dev site. That site is retired and
      # both branches now share one config, so discarding dev's version would
      # silently throw away real config changes instead of protecting anything.
      - name: Merge dev into main
        run: |
          git merge origin/dev --no-commit --no-ff
          git commit -m "Promote dev to production"

      - name: Push to main
        run: git push origin main
