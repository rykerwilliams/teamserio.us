name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages.
#
# This runs alongside the legacy SSH/SCP deploy to the AWS box until DNS is
# cut over, so both targets stay current and rolling back is just a DNS change.
# Delete jekyll-build-and-deploy-prod.yml once Pages is serving teamserio.us.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. Queue rather than cancel, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.4'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
          # chulapa 2.x pulls in jekyll-github-metadata, which calls the GitHub
          # API. Authenticated calls avoid anonymous rate limiting.
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build

      # NOTE: no "Clean Extensions" step. That existed to strip .html for
      # openresty. GitHub Pages resolves /posts/foo to posts/foo.html natively,
      # and stripping the extension would also rename 404.html and break the
      # custom 404 page.

      # Pages binds a custom domain from the deployed artifact, not only from the
      # repository setting. The preview deployment did not serve its domain until
      # an artifact carrying this file was published, and the production domain
      # behaved the same way: no certificate was requested until the artifact
      # declared it.
      - name: Set custom domain
        run: echo "teamserio.us" > _site/CNAME

      - name: Check site size against the Pages limit
        run: |
          bytes=$(du -sb _site | cut -f1)
          mb=$(( bytes / 1024 / 1024 ))
          echo "Published site: ${mb} MB"
          if [ "$mb" -gt 900 ]; then
            echo "::error::Site is ${mb} MB. GitHub Pages hard-limits published sites to 1 GB."
            echo "Run script/prep-images.sh --apply, and move large media off the repo."
            exit 1
          elif [ "$mb" -gt 500 ]; then
            echo "::warning::Site is ${mb} MB, over half the 1 GB Pages limit."
          fi

      - name: Check gallery images and thumbnails resolve
        run: |
          python3 - <<'PY'
          import re, os, glob, sys, urllib.parse
          refs = set()
          for h in glob.glob("_site/**/*.html", recursive=True):
              html = open(h, encoding="utf-8", errors="ignore").read()
              refs |= set(re.findall(r'src="(/assets/thumbs/[^"]+)"', html))
              refs |= set(re.findall(r'href="(/assets/images/[^"]+\.(?:jpg|jpeg|JPG|JPEG))"', html))
          missing = [r for r in refs if not os.path.isfile("_site" + urllib.parse.unquote(r))]
          print(f"checked {len(refs)} gallery URLs, {len(missing)} missing")
          for m in sorted(missing)[:20]:
              print(f"::error::missing file for {m}")
          if missing:
              print("::error::Gallery assets are missing. Run: script/prep-images.sh --apply")
              sys.exit(1)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
